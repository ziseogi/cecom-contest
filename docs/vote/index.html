<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CECOM 아두이노로 쓸데없는 물건 만들기 대회 부원 투표">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://cecom-arduino-contest-26-vote.calmhinny34.chatgpt.site; base-uri 'none'; form-action 'none'">
  <title>부원 투표 · CECOM 아두이노 대회</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body data-role="vote">
  <header><div class="bar"><div class="brand"><span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></svg></span><div><strong>CECOM</strong><small>2026 · 2학기 대회</small></div></div><span class="tag">부원 투표</span></div></header>
  <main>
    <section class="hero"><p class="eyebrow">ARDUINO CONTEST / CECOM</p><h1>아두이노로<br>쓸데없는 물건 만들기</h1><p>기술력은 있는데, 쓸모는 없다!</p></section>
    <section id="entry" class="panel">
      <h2 id="entry-title">부원 투표 참여</h2>
      <p id="entry-help" class="muted">부원 인증을 준비하고 있습니다.</p>
      <p class="muted">제출한 이름, 학번 끝 4자리와 선택한 작품은 대회 운영진이 확인할 수 있습니다.</p>
      <form id="gate" method="post" autocomplete="off" hidden>
        <label for="voter-name">이름</label>
        <div class="gate-row"><input id="voter-name" name="voterName" type="text" maxlength="50" required></div>
        <label for="student-id">학번</label>
        <div class="gate-row"><input id="student-id" name="studentId" type="password" inputmode="numeric" pattern="[0-9]{7,12}" minlength="7" maxlength="12" required></div>
        <div class="vote-action"><button>인증하고 작품 보기 <span aria-hidden="true">→</span></button></div>
      </form>
      <button id="entry-reload" type="button" class="secondary" hidden>다시 불러오기</button>
      <p id="entry-error" class="error" role="alert"></p>
    </section>
    <div id="content" hidden></div>
    <div id="notice" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
