<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CECOM 아두이노로 쓸데없는 물건 만들기 대회 운영 대시보드">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>CECOM 대회 운영 대시보드</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg">
    <symbol id="chip" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="clipboard" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M8 14l3 3 5-6"/></symbol>
    <symbol id="vote" viewBox="0 0 24 24"><path d="M8 13 5 9l8-6 6 8-3 2m-13 1h18v7H3zm6 3h6m-3-9 1 2 3-3"/></symbol>
    <symbol id="trophy" viewBox="0 0 24 24"><path d="M8 3h8v7a4 4 0 0 1-8 0zm0 2H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 3v5m-4 2h8m-7 0v-2h6v2"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-13 5h2m4 0h2"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zm8 0v5h4m-9 5h6m-6 4h6"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
  </svg>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#overview"><span class="brand-mark"><svg><use href="#chip"/></svg></span><span><strong>CECOM</strong><small>CONTEST DESK</small></span></a>
      <nav aria-label="대시보드 메뉴">
        <p>대회 운영</p>
        <a href="#overview" data-view="overview"><svg><use href="#grid"/></svg>운영 현황</a>
        <a href="#teams" data-view="teams"><svg><use href="#folder"/></svg>팀 및 제출물</a>
        <p>심사 및 집계</p>
        <a href="#judging" data-view="judging"><svg><use href="#clipboard"/></svg>심사위원 점수</a>
        <a href="#votes" data-view="votes"><svg><use href="#vote"/></svg>부원 투표</a>
        <a href="#ranking" data-view="ranking"><svg><use href="#trophy"/></svg>최종 순위</a>
        <p>참여 설정</p>
        <a href="#participation" data-view="participation"><svg><use href="#chip"/></svg>참여 링크·심사위원</a>
        <a href="#settings" data-view="settings"><svg><use href="#calendar"/></svg>일정 관리</a>
      </nav>
      <div class="sidebar-foot"><span></span> 2026년 2학기 CECOM 대회</div>
    </aside>
    <div class="workspace">
      <header class="top"><div><span>CECOM</span><span class="slash">/</span><strong id="crumb">운영 현황</strong></div><button class="sync" id="refresh" type="button"><i></i><span id="sync-text">불러오는 중</span></button></header>
      <main id="main" aria-busy="true"><div class="loading">대시보드를 불러오는 중입니다.</div></main>
    </div>
  </div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
